<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebPayback Essentials</title>
    
    <!-- WebPayback Protocol Meta Tags -->
    <meta name="webpayback-protection" content="enabled" />
    <meta name="webpayback-version" content="1.0.0" />
    <meta name="description" content="WebPayback Protocol - Decentralized AI Content Rewards Platform" />
    
    <!-- Theme and styling -->
    <meta name="theme-color" content="#00bfff" />
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
          'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
          sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        background: hsl(240, 10%, 3.9%);
        color: hsl(0, 0%, 98%);
      }
      
      #root {
        min-height: 100vh;
      }
      
      /* Loading spinner */
      .loading {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        background: hsl(240, 10%, 3.9%);
      }
      
      .spinner {
        width: 40px;
        height: 40px;
        border: 4px solid hsl(240, 3.7%, 15.9%);
        border-top: 4px solid hsl(190, 100%, 50%);
        border-radius: 50%;
        animation: spin 1s linear infinite;
      }
      
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="loading">
        <div class="spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
